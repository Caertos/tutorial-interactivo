<!-- {"titulo": "Playground", "cuando": "Solo si puedes reproducir la semántica real de la unidad en el navegador. La lógica va en el script propio del tutorial; ejemplo en assets/core/ejemplos/playground-sum.js."} -->
<div class="play" data-playground="sum">
  <div class="play-row">
    <span class="paren">sum(</span>
    <div class="field a"><label for="pg-a">a</label><input id="pg-a" data-in="a" value="4" autocomplete="off" spellcheck="false"></div>
    <span class="paren">,</span>
    <div class="field b"><label for="pg-b">b</label><input id="pg-b" data-in="b" value="2.5" autocomplete="off" spellcheck="false"></div>
    <span class="paren">)</span>
  </div>
  <div class="result" data-out aria-live="polite">
    <div class="muted" style="font-size:.85rem">Devuelve</div>
    <div class="val" data-val>6.5</div>
    <p data-msg></p>
  </div>
  <div class="presets">
    <button class="btn" type="button" data-a="10" data-b="5">10, 5</button>
    <button class="btn" type="button" data-a="0.1" data-b="0.2">0.1, 0.2</button>
    <button class="btn" type="button" data-a='"2"' data-b="3">"2", 3</button>
    <button class="btn" type="button" data-a="5" data-b="">5, (vacío)</button>
  </div>
</div>
